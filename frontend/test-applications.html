<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Applications</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #333; margin-bottom: 20px; }
        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { opacity: 0.9; }
        .section {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .application-card {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .status { display: inline-block; padding: 5px 10px; border-radius: 5px; font-size: 12px; }
        .status-pending { background: #ffc107; color: #000; }
        .status-accepted { background: #28a745; color: #fff; }
        .status-rejected { background: #dc3545; color: #fff; }
        pre { background: #2d2d2d; color: #f8f8f2; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Test Applications System</h1>
        
        <div class="section">
            <h3>Step 1: Login as Employer</h3>
            <button onclick="loginAsEmployer()">Login as Employer</button>
            <div id="loginResult"></div>
        </div>

        <div class="section">
            <h3>Step 2: Fetch Applications</h3>
            <button onclick="fetchApplications()">Fetch Applications</button>
            <button onclick="applyForJob()">Apply for Job (as Job Seeker)</button>
            <div id="applicationsResult"></div>
        </div>

        <div class="section">
            <h3>Step 3: View Results</h3>
            <div id="applicationsList"></div>
        </div>

        <div class="section">
            <h3>Debug Info</h3>
            <button onclick="showDebugInfo()">Show Debug Info</button>
            <pre id="debugInfo">Click button to see debug info</pre>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let employerToken = null;

        async function loginAsEmployer() {
            const resultDiv = document.getElementById('loginResult');
            resultDiv.innerHTML = '<p>Logging in...</p>';

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'employer@test.com',
                        password: 'password123'
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    employerToken = data.token;
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    resultDiv.innerHTML = `
                        <p style="color: green;">✓ Logged in as ${data.user.name}</p>
                        <p>Role: ${data.user.role}</p>
                        <p>Token: ${data.token.substring(0, 20)}...</p>
                    `;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">✗ Login failed: ${data.message}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">✗ Error: ${error.message}</p>`;
            }
        }

        async function fetchApplications() {
            const resultDiv = document.getElementById('applicationsResult');
            const listDiv = document.getElementById('applicationsList');
            
            if (!employerToken) {
                resultDiv.innerHTML = '<p style="color: red;">Please login first!</p>';
                return;
            }

            resultDiv.innerHTML = '<p>Fetching applications...</p>';

            try {
                const response = await fetch(`${API_URL}/applications/employer`, {
                    headers: {
                        'Authorization': employerToken
                    }
                });

                const applications = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `<p style="color: green;">✓ Found ${applications.length} application(s)</p>`;
                    
                    if (applications.length === 0) {
                        listDiv.innerHTML = '<p>No applications yet. Try applying for a job first!</p>';
                    } else {
                        listDiv.innerHTML = applications.map(app => `
                            <div class="application-card">
                                <h4>${app.applicant?.name || 'Unknown'}</h4>
                                <p>📧 ${app.applicant?.email || 'No email'}</p>
                                <p>💼 Job: ${app.job?.title || 'Unknown job'}</p>
                                <p>📝 Cover Letter: ${app.coverLetter || 'None'}</p>
                                <p>📅 Applied: ${new Date(app.createdAt).toLocaleString()}</p>
                                <span class="status status-${app.status.toLowerCase()}">${app.status}</span>
                            </div>
                        `).join('');
                    }
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">✗ Error: ${applications.message}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">✗ Error: ${error.message}</p>`;
            }
        }

        async function applyForJob() {
            const resultDiv = document.getElementById('applicationsResult');
            resultDiv.innerHTML = '<p>Applying for job...</p>';

            try {
                // First login as job seeker
                const loginResponse = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'jobseeker@test.com',
                        password: 'password123'
                    })
                });

                const loginData = await loginResponse.json();
                const jobSeekerToken = loginData.token;

                // Get first job
                const jobsResponse = await fetch(`${API_URL}/jobs`);
                const jobsData = await jobsResponse.json();
                const firstJob = jobsData.items[0];

                if (!firstJob) {
                    resultDiv.innerHTML = '<p style="color: red;">No jobs available to apply for!</p>';
                    return;
                }

                // Apply for the job
                const applyResponse = await fetch(`${API_URL}/applications/${firstJob._id}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': jobSeekerToken,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        coverLetter: 'Test application from test page'
                    })
                });

                const applyData = await applyResponse.json();

                if (applyResponse.ok) {
                    resultDiv.innerHTML = `
                        <p style="color: green;">✓ Applied for: ${firstJob.title}</p>
                        <p>Now fetch applications to see it!</p>
                    `;
                } else {
                    resultDiv.innerHTML = `<p style="color: orange;">⚠ ${applyData.message}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">✗ Error: ${error.message}</p>`;
            }
        }

        function showDebugInfo() {
            const debugDiv = document.getElementById('debugInfo');
            const user = localStorage.getItem('user');
            const token = localStorage.getItem('token');

            debugDiv.textContent = JSON.stringify({
                localStorage: {
                    user: user ? JSON.parse(user) : null,
                    token: token ? token.substring(0, 30) + '...' : null
                },
                employerToken: employerToken ? employerToken.substring(0, 30) + '...' : null,
                apiUrl: API_URL
            }, null, 2);
        }
    </script>
</body>
</html>
