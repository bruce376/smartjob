<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="30" cy="30" r="28" fill="url(#gradient1)"/>
  
  <!-- Briefcase Icon -->
  <g transform="translate(15, 15)">
    <!-- Briefcase body -->
    <rect x="5" y="12" width="20" height="14" rx="2" fill="white"/>
    <!-- Briefcase handle -->
    <path d="M10 12 L10 8 C10 6.5 11 6 12.5 6 L17.5 6 C19 6 20 6.5 20 8 L20 12" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Briefcase lock -->
    <rect x="13.5" y="16" width="3" height="4" rx="0.5" fill="url(#gradient1)"/>
  </g>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
