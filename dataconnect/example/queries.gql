mutation CreateUser($displayName: String!, $email: String) @auth(level: USER) {
  user_insert(data: { displayName: $displayName, email: $email, id_expr: "uuidV4()", createdAt_expr: "request.time" })
}

query GetMovies @auth(level: PUBLIC, insecureReason: "This operation is safe to expose to the public") {
  movies {
    id
    title
    year
    runtime
    genres
    summary
  }
}

mutation AddMovieToList($listId: UUID!, $movieId: UUID!, $note: String, $position: Int!) @auth(level: USER) {
  listMovie_insert(data: { listId: $listId, movieId: $movieId, note: $note, position: $position })
}

query GetListsForUser @auth(level: USER) {
  lists(where: { userId: { eq_expr: "auth.uid" } }) {
    id
    name
    description
    public
    createdAt
    updatedAt
  }
}