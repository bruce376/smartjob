[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/dist"

# Handle SPA routing for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables for production
[context.production.environment]
  VITE_API_BASE_URL = "https://smartjob-api-ugtf.onrender.com"
  VITE_DEBUG = "false"
